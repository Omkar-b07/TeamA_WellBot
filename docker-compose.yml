version: '3.9'

services:
  rasa:
    image: rasa/rasa:3.6.2-full
    ports:
      - "5005:5005"
    volumes:
      - ./backend/rasa_bot:/app
    command:
      - run
      - --enable-api
      - --cors
      - "*"
      - --endpoints
      - /app/endpoints.docker.yml
      - --port
      - "5005"
    restart: unless-stopped
    depends_on:
      - action_server

  action_server:
    build: ./backend/rasa_bot
    volumes:
      - db_data:/data
    environment:
      - WELLBOT_DB_PATH=/data/project.db
    ports:
      - "5055:5055"
    command: ["start", "--actions", "actions", "--port", "5055"]
    restart: unless-stopped

  flask_app:
    build:
      context: .
      dockerfile: backend/web_api/Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - db_data:/data
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - AUTO_INIT_DB=true
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - DATABASE_URL=sqlite:////data/project.db
      - RASA_API_URL=http://rasa:5005/webhooks/rest/webhook
      - JWT_COOKIE_SECURE=${JWT_COOKIE_SECURE:-true}
      - JWT_COOKIE_CSRF_PROTECT=${JWT_COOKIE_CSRF_PROTECT:-true}
    depends_on:
      - rasa
    restart: unless-stopped

volumes:
  db_data:
